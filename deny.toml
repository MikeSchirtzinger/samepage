# cargo deny check: what may enter the dependency graph.
# Run from the workspace root; CI runs it on every pull request.

[advisories]
# Every RustSec vulnerability fails the check. An unmaintained notice fails
# too, unless it is listed here with the reason it cannot be acted on yet.
ignore = [
  # smallstr is unmaintained and has no replacement release. It reaches us
  # only through yrs, the CRDT library every document crate uses. Revisit
  # when yrs drops or replaces it.
  { id = "RUSTSEC-2026-0215", reason = "transitive through yrs, no upgrade exists" },
]

[licenses]
# Licenses compatible with shipping this MIT workspace. A crate offering a
# choice (MIT OR Apache-2.0 OR LGPL-2.1-or-later) passes on any allowed arm.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate cost build time and binary size, but they are
# usually forced by upstream. Report them; do not fail on them.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# pretext-rs is pinned by revision for ag-ui-canvas-web, which is
# publish = false for exactly this reason.
allow-git = ["https://github.com/MikeSchirtzinger/pretext-rs.git"]
