[package]
name = "same-page-atlas-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The browser half of the shared atlas: a real yrs replica in the page, speaking y-sync over the runtime's /ws."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
user-timing = ["dep:wasm-tracing"]

# Same workaround the other wasm packages in this repo carry: wasm-pack's
# bundled wasm-opt predates the bulk-memory ops rustc emits.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
ag-ui-canvas = { workspace = true }
same-page-atlas-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
yrs = { workspace = true }
console_error_panic_hook = "0.1"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-tracing = { version = "2.1", optional = true }

[lints]
workspace = true
