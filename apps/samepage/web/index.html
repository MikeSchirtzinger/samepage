<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SamePage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div><strong>SamePage</strong><span class="subhead">Shared map</span></div>
    <div id="connection-status" role="status">Loading document…</div>
  </header>
  <div id="error-banner" class="error-banner" role="alert" hidden></div>
  <main>
    <section class="toolbar" aria-label="Map controls">
      <form id="add-card"><label for="new-card-label">New card</label><input id="new-card-label" name="label" maxlength="140" required><button type="submit">Add card</button></form>
      <button id="architecture-open" type="button">Compare architecture</button>
      <button id="activity-toggle" type="button" aria-expanded="false">Activity</button>
      <span id="trace-health" role="status"></span>
      <span id="map-count" aria-live="polite">Loading map…</span>
    </section>
    <div id="trace" aria-label="Trace capability status"></div>
    <div id="architecture" aria-label="Architecture proposals" hidden></div>
    <button id="board-open" type="button">Board</button>
    <div id="sketch" aria-label="Drawing tools"></div>
    <section class="toolbar" aria-label="Pane controls"><button id="open-panes" type="button">Panes</button><form id="person-name"><label for="person-display-name">Your name</label><input id="person-display-name" maxlength="120" required><button type="submit">Use name</button></form><span id="pane-ask" role="status"></span></section>
    <div id="panes" aria-label="Shared panes" hidden></div>
    <div id="diagrams" aria-label="Diagram capability status"></div>
    <div class="surface-layout">
      <div id="map" aria-label="Shared cards and links"></div>
      <aside id="review" aria-label="Review" hidden></aside>
      <aside id="board" aria-label="Board" hidden></aside>
    </div>
  </main>
  <script type="module" src="/shell.js"></script>
</body>
</html>
