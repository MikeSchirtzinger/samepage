[package]
name = "samepage-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "samepage"
path = "src/main.rs"

[dependencies]
ag-ui-surface = { workspace = true }
samepage-capability = { path = "../../crates/samepage-capability" }
samepage-doc = { path = "../../crates/samepage-doc" }
samepage-map = { path = "../../crates/samepage-map" }
samepage-diagrams = { path = "../../crates/samepage-diagrams" }
samepage-review = { path = "../../crates/samepage-review" }
samepage-architecture = { path = "../../crates/samepage-architecture" }
samepage-board = { path = "../../crates/samepage-board" }
samepage-sketch = { path = "../../crates/samepage-sketch" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sha2 = "0.10"

samepage-trace = { path = "../../crates/samepage-trace" }
samepage-panes = { path = "../../crates/samepage-panes", default-features = false }
parking_lot = { workspace = true }

[lints]
workspace = true
