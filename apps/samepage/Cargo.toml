[package]
name = "samepage-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "samepage"
path = "src/main.rs"

[dependencies]
ag-ui-surface = { workspace = true }
samepage-capability = { path = "../../crates/samepage-capability" }
samepage-doc = { path = "../../crates/samepage-doc" }
samepage-map = { path = "../../crates/samepage-map" }
samepage-diagrams = { path = "../../crates/samepage-diagrams" }
samepage-review = { path = "../../crates/samepage-review" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sha2 = "0.10"
samepage-sources = { path = "../../crates/samepage-sources", default-features = false }
toml = "0.8"
samepage-lanes = { path = "../../crates/samepage-lanes", default-features = false }
samepage-extract = { path = "../../crates/samepage-extract" }

[lints]
workspace = true
