[package]
name = "samepage-agui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "AG-UI protocol event, message and state types for SamePage, derived from the ag-ui-core crate of the AG-UI Rust SDK."

[dependencies]
convergence-attrs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# wasm32 targets need uuid's `js` feature (it pulls in the JS-backed RNG).
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[lints]
workspace = true
