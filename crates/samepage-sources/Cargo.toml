[package]
name = "samepage-sources"
version.workspace = true
description = "The SamePage sources capability: binds cards to source files and line ranges, and checks each binding against the file before it is committed."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wasm-export"]
wasm-export = []

[dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability" }
samepage-map = { version = "=0.1.0", path = "../samepage-map", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen.workspace = true

[dev-dependencies]
samepage-diagrams = { path = "../samepage-diagrams", default-features = false }
samepage-doc = { path = "../samepage-doc" }
samepage-review = { path = "../samepage-review", default-features = false }
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true
