[package]
name = "samepage-trace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded typed spans and activity projection for SamePage."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled wasm-opt predates the bulk-memory ops rustc emits.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wasm-export"]
wasm-export = []

[dependencies]
samepage-capability = { path = "../samepage-capability" }
serde = { workspace = true }
serde_json = { workspace = true }

# The WebAssembly artifact exports the capability ABI; native builds do not
# carry wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
