[package]
name = "samepage-cement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wasm-export"]
wasm-export = []

[dependencies]
samepage-capability = { path = "../samepage-capability" }
samepage-sources = { path = "../samepage-sources", default-features = false }
samepage-lanes = { path = "../samepage-lanes", default-features = false }
samepage-review = { path = "../samepage-review", default-features = false }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen.workspace = true

[dev-dependencies]
samepage-diagrams = { path = "../samepage-diagrams", default-features = false }
samepage-doc = { path = "../samepage-doc" }
samepage-map = { path = "../samepage-map", default-features = false }
samepage-extract = { path = "../samepage-extract" }
toml = "0.8"

[lints]
workspace = true
