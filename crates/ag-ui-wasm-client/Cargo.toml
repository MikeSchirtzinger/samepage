[package]
name = "ag-ui-wasm-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser AG-UI client. Compiles to wasm32-unknown-unknown. Uses EventSource for SSE subscription and fetch for writes. Shares types with ag-ui-core."

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack bundles an old wasm-opt that doesn't recognize bulk-memory ops
# emitted by Rust 1.95. Disable post-processing for now; the 324K artifact
# is fine for local dev. Re-enable once `brew install binaryen` is on PATH.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
ag-ui-core = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "EventSource",
  "EventTarget",
  "Event",
  "MessageEvent",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "console",
]

[lints]
workspace = true
