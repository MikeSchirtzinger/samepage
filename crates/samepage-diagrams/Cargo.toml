[package]
name = "samepage-diagrams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed diagrams, atomic planning, layout, routing and read-back for SamePage."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled wasm-opt predates the bulk-memory ops rustc emits.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
integrated-sources = []

[dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability" }
samepage-map = { version = "=0.1.0", path = "../samepage-map", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

# The WebAssembly artifact exports the capability ABI; native builds do not
# carry wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen = { workspace = true }

[dev-dependencies]
samepage-doc = { path = "../samepage-doc" }
yrs = { workspace = true }
base64 = "0.22"

[lints]
workspace = true
