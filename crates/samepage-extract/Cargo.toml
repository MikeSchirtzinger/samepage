[package]
name = "samepage-extract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic, source-only extraction of every execution lane a codebase actually has (binaries, listeners, spawned processes, outbound calls, background tasks), each one anchored to a file, a line, and the line's own text."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ignore = "0.4"
regex = "1"

[lints]
workspace = true
