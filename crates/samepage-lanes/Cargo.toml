[package]
name = "samepage-lanes"
version.workspace = true
description = "The SamePage lanes capability: reconciles what a source scan finds with the cards people placed, and reports the found-in-the-code strip."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wasm-export"]
wasm-export = []

[dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability" }
samepage-sources = { version = "=0.1.0", path = "../samepage-sources", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen.workspace = true

[dev-dependencies]
samepage-doc = { path = "../samepage-doc" }
samepage-map = { path = "../samepage-map", default-features = false }
samepage-extract = { path = "../samepage-extract" }
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true
