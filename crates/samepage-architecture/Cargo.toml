[package]
name = "samepage-architecture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared relationship proposals, comparisons and human verdicts for SamePage."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["wasm-export"]
wasm-export = []

[dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability" }
samepage-map = { version = "=0.1.0", path = "../samepage-map", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
samepage-capability = { version = "=0.1.0", path = "../samepage-capability", features = ["wasm-export"] }
wasm-bindgen = { workspace = true }

[dev-dependencies]
samepage-doc = { path = "../samepage-doc" }
yrs = { workspace = true }

[lints]
workspace = true
